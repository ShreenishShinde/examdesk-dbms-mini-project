{% extends 'base.html' %}{% block title %}Create account{% endblock %}{% block content %}<div class="form-wrap"><div class="form-card"><span class="eyebrow">JOIN EXAMDESK</span><h1 class="h2 mt-2">Create your account</h1><p class="text-muted">Students can book available slots. Examiners need administrator approval.</p><form method="post"><label class="form-label mt-2">Full name</label><input class="form-control" name="name" required><label class="form-label mt-3">Email</label><input class="form-control" type="email" name="email" required><label class="form-label mt-3">I am registering as</label><select class="form-select" name="role"><option value="student">Student</option><option value="examiner">Examiner</option></select><label class="form-label mt-3">Department <span class="text-muted">(examiners)</span></label><input class="form-control" name="department"><label class="form-label mt-3">Password</label><input class="form-control" type="password" name="password" minlength="8" required><button class="btn btn-primary w-100 mt-4">Create account</button></form></div></div>{% endblock %}
